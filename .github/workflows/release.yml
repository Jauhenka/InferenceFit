name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install release dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Derive the release version from the tag
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          test -n "$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Confirm the tag matches the package version
        run: >-
          python -c "import inferencefit, os;
          actual = inferencefit.__version__;
          expected = os.environ['RELEASE_VERSION'];
          assert actual == expected, f'tag version {expected!r} does not match package version {actual!r}'"
      - name: Remove stale build directories
        run: rm -rf dist build
      - name: Build the distributions once
        run: python -m build
      - name: Validate distribution metadata with Twine
        run: python -m twine check dist/*
      - name: Audit distribution contents
        run: python scripts/audit_distribution.py dist --expected-version "$RELEASE_VERSION"
      - name: Verify the installed wheel
        run: >-
          python scripts/verify_artifact_install.py
          "dist/inferencefit-${RELEASE_VERSION}-py3-none-any.whl" "$RELEASE_VERSION" .
      - name: Verify the installed sdist
        run: >-
          python scripts/verify_artifact_install.py
          "dist/inferencefit-${RELEASE_VERSION}.tar.gz" "$RELEASE_VERSION" .
      - name: Upload the verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish verified distributions
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
