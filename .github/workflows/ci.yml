name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package with development dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Run the offline test suite
        run: python -m pytest

  quality:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the package with development dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Check formatting with Ruff
        run: ruff format --check .

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the package with development dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Remove stale build directories
        run: rm -rf dist build
      - name: Build the distributions once
        run: python -m build
      - name: Validate distribution metadata with Twine
        run: python -m twine check dist/*
      - name: Audit distribution contents
        run: python scripts/audit_distribution.py dist --expected-version 0.2.0
      - name: Verify the installed wheel
        run: python scripts/verify_artifact_install.py dist/inferencefit-0.2.0-py3-none-any.whl 0.2.0 .
      - name: Verify the installed sdist
        run: python scripts/verify_artifact_install.py dist/inferencefit-0.2.0.tar.gz 0.2.0 .
      - name: Upload the verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
