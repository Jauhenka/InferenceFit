schema_version: "0.1"
dataset:
  path: dataset.multilingual.jsonl
candidates:
  - id: cheap-fixture
    provider: fixture
    model: illustrative-cheap
    parameters:
      fixture_path: fixtures/cheap.jsonl
    pricing:
      input_per_million: 0.05
      output_per_million: 0.20
  - id: strong-fixture
    provider: fixture
    model: illustrative-strong
    parameters:
      fixture_path: fixtures/strong.jsonl
    pricing:
      input_per_million: 0.30
      output_per_million: 1.20
validators:
  - id: response-schema
    type: json_schema
    routing_gate: true
    config:
      schema:
        type: object
        required: [units]
        additionalProperties: false
        properties:
          units:
            type: array
            items:
              type: object
              required: [type, value]
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum: [need, budget, timeline, location, constraint, contact, preference, exclusion]
                value:
                  type: string
                  minLength: 1
  - id: exact-units
    type: exact
    target: /units
    reference: /units
constraints:
  min_success_rate: 0.80
  max_provider_error_rate: 0.0
optimization:
  objective: min_cost
  cascade:
    primary: cheap-fixture
    fallbacks: [strong-fixture]
execution:
  repetitions: 1
  concurrency: 4
  timeout_ms: 30000
  retry:
    max_attempts: 2
    initial_backoff_ms: 10
    max_backoff_ms: 50

