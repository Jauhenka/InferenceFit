schema_version: "0.1"
dataset:
  path: dataset.smoke.jsonl
candidates:
  - id: openai-gpt-6-luna
    provider: openai
    model: gpt-6-luna
    credential_ref: openai-main
    parameters:
      temperature: 0
      max_output_tokens: 64
validators:
  - id: exact-units
    type: exact
    target: /units
    reference: /units
optimization:
  objective: max_quality
execution:
  repetitions: 1
  concurrency: 1
  retry:
    max_attempts: 1
