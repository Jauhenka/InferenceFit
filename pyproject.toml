[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferencefit"
version = "0.1.0"
description = "Local-first benchmarking and deterministic LLM configuration optimizer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "InferenceFit contributors" }]
keywords = ["llm", "benchmarking", "optimization", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.scripts]
inferencefit = "inferencefit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inferencefit"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", ".inferencefit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
